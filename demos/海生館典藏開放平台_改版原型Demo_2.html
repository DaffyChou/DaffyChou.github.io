<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海生館典藏開放平台｜改版原型 Demo</title>
<style>
:root{
  --navy:#12314f; --navy2:#1b4a75; --teal:#127a7f; --teal2:#0f9aa1;
  --sand:#f6f3ec; --bg:#f2f5f7; --ink:#16242f; --mute:#5d707e;
  --line:#dce5ea; --card:#ffffff; --accent:#e0663c; --ok:#1f7a4d;
  --shadow:0 1px 2px rgba(18,49,79,.06),0 8px 24px rgba(18,49,79,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit}
a{color:var(--navy2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--teal2);outline-offset:2px}

/* ── demo chrome ── */
#demobar{
  background:#0d2136;color:#cfe0ec;font-size:12.5px;
  padding:7px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
#demobar strong{color:#fff;font-weight:600}
#demobar .sp{flex:1}
.tgl{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.tgl input{accent-color:var(--teal2);width:15px;height:15px}

/* ── header ── */
header.site{background:var(--navy);color:#fff;padding:14px 18px 16px}
.hwrap{max-width:1280px;margin:0 auto}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,var(--teal2),#1b4a75);display:grid;place-items:center}
.logo b{font-size:17px;letter-spacing:.5px}
.logo span{display:block;font-size:11px;color:#9dc0d6;font-weight:400;letter-spacing:1px}
.navlinks{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.navlinks button{background:none;border:0;color:#c8dcea;padding:6px 11px;border-radius:7px;cursor:pointer;font-size:13.5px}
.navlinks button:hover{background:rgba(255,255,255,.1);color:#fff}

.searchrow{margin-top:14px;position:relative}
.sbox{display:flex;background:#fff;border-radius:12px;overflow:visible;box-shadow:0 4px 18px rgba(0,0,0,.18);position:relative}
.sbox input{flex:1;border:0;padding:14px 18px;font-size:16px;border-radius:12px 0 0 12px;color:var(--ink);min-width:0}
.sbox button.go{border:0;background:var(--teal);color:#fff;padding:0 24px;cursor:pointer;font-size:15px;font-weight:600;border-radius:0 12px 12px 0}
.sbox button.go:hover{background:var(--teal2)}
.hint{margin-top:9px;font-size:12.5px;color:#9dc0d6}
.hint b{color:#ffd9a8;font-weight:600}
.qmode{display:inline-flex;background:rgba(255,255,255,.13);border-radius:8px;padding:2px}
.qmode button{border:0;background:none;color:#bcd6e6;padding:4px 11px;border-radius:6px;cursor:pointer;font-size:12.5px}
.qmode button.on{background:#fff;color:var(--navy);font-weight:600}
.exchip{border:1px dashed rgba(255,255,255,.34);background:none;color:#cfe4f2;border-radius:20px;padding:3px 11px;cursor:pointer;font-size:12px}
.exchip:hover{border-style:solid;border-color:var(--teal2);background:rgba(15,154,161,.22);color:#fff}
.semb{background:linear-gradient(115deg,#0f5f66,#13808a);color:#fff;border-radius:14px;padding:15px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.semb .lead{font-size:13px;opacity:.86;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.semb .qq{font-size:17px;font-weight:600;margin:5px 0 11px}
.semb .cw{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.semb .cc{background:rgba(255,255,255,.18);border-radius:20px;padding:3px 11px;font-size:12.5px}
.semb .cc b{font-weight:600}
.semb .cc small{opacity:.72}
.semb .rest{margin-top:10px;font-size:12px;opacity:.8}
.semtop{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px;margin:13px 0 0}
.semc{background:rgba(255,255,255,.94);border-radius:11px;padding:10px 12px;cursor:pointer;color:var(--ink);display:flex;gap:10px;align-items:center}
.semc:hover{background:#fff;transform:translateY(-2px)}
.semc .ic{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;flex:none}
.semc .ic svg{width:28px;height:28px}
.semc .zh{font-weight:600;font-size:14px;line-height:1.3}
.semc .hit{font-size:11px;color:var(--mute);line-height:1.4;margin-top:1px}
.semc .bar{height:4px;border-radius:4px;background:#e2eaee;margin-top:5px;overflow:hidden}
.semc .bar i{display:block;height:100%;background:var(--teal2)}
#ac{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border-radius:11px;box-shadow:0 12px 34px rgba(0,0,0,.25);z-index:60;overflow:hidden;display:none}
#ac div.it{padding:9px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;color:var(--ink)}
#ac div.it:hover,#ac div.it.on{background:#eaf4f5}
#ac .sci{color:var(--mute);font-style:italic;font-size:13px}
#ac .tag{margin-left:auto;font-size:11px;color:#fff;background:var(--teal);padding:1px 8px;border-radius:20px}

/* ── layout ── */
main{max-width:1280px;margin:0 auto;padding:18px;display:grid;grid-template-columns:264px 1fr;gap:18px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}

aside{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;position:sticky;top:12px}
.stabs{display:flex;border-bottom:1px solid var(--line)}
.stabs button{flex:1;border:0;background:none;padding:11px 4px;cursor:pointer;font-size:13px;color:var(--mute);border-bottom:3px solid transparent}
.stabs button.on{color:var(--navy);font-weight:600;border-bottom-color:var(--teal)}
.spane{padding:12px 14px 18px;display:none}
.spane.on{display:block}
.fgroup{border-bottom:1px solid var(--line);padding:10px 0}
.fgroup:last-child{border-bottom:0}
.fgroup h4{margin:0 0 7px;font-size:13px;color:var(--navy);display:flex;align-items:center;gap:6px}
.fgroup h4 .c{margin-left:auto;font-size:11px;color:var(--mute);font-weight:400}
.opt{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;font-size:13.5px;color:#33454f}
.opt input{accent-color:var(--teal);width:14px;height:14px;flex:none}
.opt .n{margin-left:auto;font-size:11.5px;color:var(--mute);background:#eef3f5;border-radius:20px;padding:0 7px;min-width:24px;text-align:center}
.opt.dis{opacity:.38;cursor:default}
.clearall{width:100%;margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px;cursor:pointer;font-size:13px;color:var(--mute)}
.clearall:hover{border-color:var(--teal);color:var(--teal)}

/* tree */
.tree{font-size:13.5px}
.tnode{padding:3px 0 3px 0}
.tnode .row{display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:6px;padding:3px 5px}
.tnode .row:hover{background:#eef5f6}
.tnode .row.sel{background:#dceff0;color:var(--navy);font-weight:600}
.tw{width:14px;color:var(--mute);flex:none;text-align:center}
.tkids{margin-left:14px;border-left:1px dashed var(--line);padding-left:6px;display:none}
.tkids.open{display:block}
.tn{font-size:11px;color:var(--mute);margin-left:auto}

/* feature search */
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;cursor:pointer;font-size:12.5px;color:#3b4d58;display:flex;gap:5px;align-items:center}
.chip:hover{border-color:var(--teal)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip svg{width:15px;height:15px}

/* ── results ── */
.toolbar{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:11px 15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.count b{color:var(--navy);font-size:17px}
.count .sub{color:var(--mute);font-size:12.5px}
.tbspacer{flex:1}
.views{display:flex;background:#eef3f5;border-radius:9px;padding:3px}
.views button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--mute);display:flex;gap:5px;align-items:center}
.views button.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
select.sort{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:#3b4d58}
.btn-x{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;color:#3b4d58}
.btn-x:hover{border-color:var(--teal);color:var(--teal)}

.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:#dceff0;color:#0d5559;border-radius:20px;padding:4px 8px 4px 12px;font-size:12.5px;display:flex;align-items:center;gap:7px}
.pill button{border:0;background:none;cursor:pointer;color:#0d5559;font-size:15px;line-height:1;padding:0 3px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.card{background:var(--card);border-radius:13px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .13s,box-shadow .13s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(18,49,79,.16)}
.thumb{aspect-ratio:4/3;position:relative;display:grid;place-items:center}
.thumb svg.ill{width:58%;height:58%;opacity:.92}
.badge{position:absolute;top:8px;left:8px;background:rgba(13,33,54,.82);color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;display:flex;gap:4px;align-items:center}
.lic{position:absolute;bottom:8px;right:8px;background:rgba(255,255,255,.94);color:#0d5559;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px}
.cbody{padding:9px 11px 12px}
.cbody .zh{font-weight:600;font-size:14.5px;line-height:1.35}
.cbody .sci{font-style:italic;color:var(--mute);font-size:12.5px}
.cbody .meta{color:var(--mute);font-size:11.5px;margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}

/* list */
.list{background:var(--card);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
table.lt{width:100%;border-collapse:collapse;font-size:13.5px}
table.lt th{background:#eef3f5;text-align:left;padding:10px 12px;color:var(--navy);font-size:12.5px;font-weight:600;white-space:nowrap}
table.lt td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
table.lt tr.r{cursor:pointer}
table.lt tr.r:hover td{background:#f4fafa}
.tmini{width:44px;height:34px;border-radius:6px;display:grid;place-items:center;flex:none}
.tmini svg{width:26px;height:26px}
td .sci{font-style:italic;color:var(--mute)}

/* map */
.mapwrap{background:var(--card);border-radius:13px;box-shadow:var(--shadow);padding:14px;display:grid;grid-template-columns:1fr 300px;gap:14px}
@media(max-width:860px){.mapwrap{grid-template-columns:1fr}}
.mapbox{background:linear-gradient(180deg,#dceef5,#c5e0ec);border-radius:11px;position:relative;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mpt{cursor:pointer}
.mapside h4{margin:2px 0 8px;font-size:14px;color:var(--navy)}
.mapside .li{display:flex;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;align-items:center;font-size:13px}
.mapside .li:hover{background:#eef5f6}
.mapside .li .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.mapside .li .n{margin-left:auto;color:var(--mute);font-size:11.5px}
.nocoord{margin-top:12px;background:#fff6ec;border:1px solid #f3d9c1;border-radius:9px;padding:9px 11px;font-size:12.5px;color:#8a5326}

/* detail page */
.page{max-width:1280px;margin:0 auto;padding:18px}
.crumbs{font-size:13px;color:var(--mute);margin-bottom:12px}
.crumbs button{border:0;background:none;color:var(--navy2);cursor:pointer;padding:0;font-size:13px}
.dwrap{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.dhero{display:grid;grid-template-columns:340px 1fr;gap:0}
@media(max-width:800px){.dhero{grid-template-columns:1fr}}
.dhero .img{aspect-ratio:1/1;display:grid;place-items:center;position:relative}
.dhero .img svg.ill{width:62%;height:62%}
.dhero .info{padding:22px 26px}
.dhero h1{margin:0;font-size:29px;color:var(--navy);line-height:1.25}
.dhero .sci{font-style:italic;color:var(--mute);font-size:16px;margin-top:2px}
.tagrow{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.tg{font-size:12px;border-radius:20px;padding:3px 11px;background:#eef3f5;color:#3b4d58}
.tg.cons{background:#fdeee7;color:#a8462a;font-weight:600}
.tg.ok{background:#e6f4ec;color:var(--ok);font-weight:600}
.blurb{font-size:15.5px;line-height:1.85;color:#263a46;margin:6px 0 0}

.modeswitch{display:inline-flex;background:#eef3f5;border-radius:9px;padding:3px;margin:16px 0 0}
.modeswitch button{border:0;background:none;padding:7px 16px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--mute)}
.modeswitch button.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}

.dsec{padding:20px 26px;border-top:1px solid var(--line)}
.dsec h3{margin:0 0 12px;font-size:16px;color:var(--navy);display:flex;align-items:center;gap:8px}
.dsec h3 .cnt{font-size:12px;color:var(--mute);font-weight:400;background:#eef3f5;border-radius:20px;padding:1px 9px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 20px}
.kv .r{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv .r .k{color:var(--mute);min-width:88px;flex:none}
.kv .r .v.empty{color:#b9c5cc}
.strip{display:flex;gap:11px;overflow-x:auto;padding-bottom:4px}
.strip .m{width:150px;flex:none;border-radius:11px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;background:#fff}
.strip .m .th{aspect-ratio:4/3;display:grid;place-items:center;position:relative}
.strip .m .th svg.ill{width:56%;height:56%}
.strip .m .cap{padding:7px 9px;font-size:12px;color:#3b4d58}
.strip .m .cap .a{color:var(--mute);font-size:11px}

table.sp{width:100%;border-collapse:collapse;font-size:13px}
table.sp th{text-align:left;background:#eef3f5;padding:8px 10px;color:var(--navy);font-size:12px;white-space:nowrap}
table.sp td{padding:8px 10px;border-top:1px solid var(--line)}
table.sp td.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
.dlc{border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.dlc.free{border-color:#a9d9b8;background:#f3fbf5}
.dlc h5{margin:0 0 3px;font-size:14px;color:var(--navy)}
.dlc .px{font-size:12px;color:var(--mute)}
.dlc .lc{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;background:#dceff0;color:#0d5559;padding:2px 8px;border-radius:5px}
.dlc button{margin-top:10px;width:100%;border:0;border-radius:8px;padding:8px;cursor:pointer;background:var(--navy);color:#fff;font-size:13px}
.dlc.free button{background:var(--ok)}
.dlc button.ghost{background:#fff;border:1px solid var(--line);color:#3b4d58}

/* annotation layer */
.ann{
  display:none;background:#fff8ea;border-left:4px solid #e0a341;border-radius:0 9px 9px 0;
  padding:9px 13px;font-size:12.5px;color:#6d4c13;margin:9px 0;line-height:1.65;
}
.ann b{color:#8a5c0d}
body.ann-on .ann{display:block}
.anndot{
  display:none;background:#e0a341;color:#fff;font-size:10px;font-weight:700;
  border-radius:20px;padding:1px 7px;margin-left:6px;vertical-align:middle;
}
body.ann-on .anndot{display:inline-block}

/* topics */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.topic{border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;position:relative;min-height:132px;display:flex;align-items:flex-end;color:#fff;padding:14px}
.topic:hover{transform:translateY(-3px)}
.topic .t{position:relative;z-index:2}
.topic .t b{display:block;font-size:16px}
.topic .t span{font-size:12px;opacity:.9}
.section-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 12px}
.section-h h2{margin:0;font-size:19px;color:var(--navy)}
.section-h span{font-size:13px;color:var(--mute)}

footer.site{max-width:1280px;margin:26px auto 40px;padding:18px;color:var(--mute);font-size:12.5px;border-top:1px solid var(--line)}
.drop{border:2px dashed #b9cdd8;border-radius:14px;padding:34px 20px;text-align:center;background:#fafcfd}
.drop b{display:block;margin-top:8px;color:var(--navy);font-size:15px}
.drop:hover{border-color:var(--teal);background:#f2fafa}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:11px}
.samp{border:1px solid var(--line);background:#fff;border-radius:11px;padding:0;overflow:hidden;cursor:pointer;text-align:left}
.samp:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.samp img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.samp span{display:block;padding:7px 9px;font-size:12.5px;color:#3b4d58}
.idwrap{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start}
@media(max-width:820px){.idwrap{grid-template-columns:1fr}}
.idimg{width:100%;border-radius:12px;display:block;background:#eef3f5;max-height:260px;object-fit:contain}
.idlist{display:flex;flex-direction:column;gap:9px}
.idc{display:flex;gap:11px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:9px 12px;cursor:pointer;background:#fff}
.idc:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.idc .ic{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;flex:none}
.idc .ic svg{width:30px;height:30px}
.idc .zh{font-weight:600;font-size:14.5px}
.idc .sci{font-style:italic;color:var(--mute);font-size:12.5px}
.idc .hit{font-size:11.5px;color:var(--mute);margin-top:1px}
.idc .bar{height:5px;border-radius:5px;background:#e2eaee;margin-top:6px;overflow:hidden}
.idc .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--teal))}
.idc .pc{font-size:19px;font-weight:700;color:var(--teal);flex:none}
.idc .pc::after{content:'%';font-size:11px;margin-left:1px}
.empty{background:var(--card);border-radius:13px;box-shadow:var(--shadow);padding:44px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--navy);font-size:16px;margin-bottom:6px}
.sug{display:inline-block;margin:4px;border:1px solid var(--line);border-radius:20px;padding:4px 12px;cursor:pointer;background:#fff;font-size:13px}
.sug:hover{border-color:var(--teal);color:var(--teal)}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(10,25,40,.6);display:none;z-index:200;padding:24px;overflow:auto}
.mbg.on{display:block}
.modal{max-width:820px;margin:20px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.mhead{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.mhead b{color:var(--navy);font-size:16px}
.mhead button{margin-left:auto;border:0;background:#eef3f5;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:17px;color:#3b4d58}
.mbody{padding:18px}
.mimg{aspect-ratio:16/9;border-radius:11px;display:grid;place-items:center;margin-bottom:14px;position:relative}
.mimg svg.ill{width:34%;height:60%}
</style>
</head>
<body class="ann-on">

<div id="demobar">
  <strong>DEMO 原型</strong>

const STOP=['住在','裡面','上面','外面','旁邊','世界上','世界','一樣','水裡','海裡','水中','海中','身上','身體','顏色','那隻','一隻','長得','看起來','的那個','那個','這個','是','有','在','會','都','一','個','和','跟','還有','很','就','然後','啊','嗎','呢','之','種','東西','生物','動物','牠','它','我','想','找','要','請','幫','看','什麼','叫','什','麼','一種','像','那','這','了','把','被','以及','或','與','小','大','的','，',',','、','。','？','?','！','!']
function semantic(qraw){
  const q=(qraw||'').trim(); if(!q)return null;
  const hits=[],used=[];
  CONCEPTS.forEach(c=>{
    const m=c.s.filter(w=>q.indexOf(w)>=0);
    if(m.length){hits.push({k:c.k,p:c.p,w:m.sort((a,b)=>b.length-a.length)[0]});used.push(...m);}
  });
  if(!hits.length)return null;
  const sc={};
  hits.forEach(h=>h.p.forEach(n=>{
    const i=SP.findIndex(s=>s.zh===n); if(i<0)return;
    sc[i]=sc[i]||{i:i,n:0,hits:[]}; sc[i].n++; sc[i].hits.push(h.k);
  }));
  const rank=Object.values(sc).sort((a,b)=>b.n-a.n||a.i-b.i);
  const max=rank[0].n;
  rank.forEach(r=>r.pct=Math.round(r.n/hits.length*100));
  let rest=q; used.sort((a,b)=>b.length-a.length).forEach(w=>{rest=rest.split(w).join('')});
  STOP.forEach(w=>{rest=rest.split(w).join('')});
  return {q:q,concepts:hits,rank:rank.filter(r=>r.n>=Math.max(1,max-1)).slice(0,12),
          spSet:new Set(rank.filter(r=>r.n>=Math.max(1,max-1)).slice(0,12).map(r=>r.i)),
          rankMap:Object.fromEntries(rank.map(r=>[r.i,r.n])), rest:rest.trim(), total:hits.length};
}
function literalHits(q){
  if(!q)return 0;
  const t=q.toLowerCase();
  return REC.filter(r=>(r.zh+r.sci+r.cat).toLowerCase().indexOf(t)>=0).length;
}

function decade(y){return Math.floor(y/10)*10+' 年代'}
function match(r,skip){
  if(F.sem&&!F.sem.spSet.has(r.s))return false;
  if(F.q){const q=F.q.toLowerCase();
    const hay=(r.zh+' '+r.sci+' '+r.cat+' '+r.loc+' '+r.g+' '+SP[r.s].zh+' '+SP[r.s].tax.join(' ')).toLowerCase();
    if(hay.indexOf(q)<0)return false;}
  if(skip!=='g'&&F.g.size&&!F.g.has(r.g))return false;
  if(skip!=='t'&&F.t.size&&!F.t.has(r.t))return false;
  if(skip!=='cy'&&F.cy.size&&!F.cy.has(r.cy))return false;
  if(skip!=='yr'&&F.yr.size&&!F.yr.has(decade(r.yr)))return false;
  if(skip!=='lic'&&F.lic.size&&!F.lic.has(r.lic))return false;
  if(F.cons&&!r.cons)return false;
  if(F.fam&&r.fam!==F.fam&&SP[r.s].tax.indexOf(F.fam)<0)return false;
  if(F.shape&&r.shape!==F.shape)return false;
  if(F.color&&r.color.indexOf(F.color)<0)return false;
  if(F.hab&&r.hab!==F.hab)return false;
  return true;
}
function results(){
  let a=REC.filter(r=>match(r));

  if(SORT==='new')a=a.slice().sort((x,y)=>y.yr-x.yr);
  if(SORT==='old')a=a.slice().sort((x,y)=>x.yr-y.yr);
  if(SORT==='az')a=a.slice().sort((x,y)=>x.zh.localeCompare(y.zh,'zh-Hant'));
  return a;
}
function facetCount(key,val){return REC.filter(r=>{
  if(!match(r,key))return false;

  if(key==='cy')return r.cy===val;
  if(key==='yr')return decade(r.yr)===val;
  if(key==='lic')return r.lic===val;

const TREE={};
SP.forEach(s=>{if(s.g==='景觀')return;
  const [k,p,c,o,f]=s.tax;
  TREE[k]=TREE[k]||{};TREE[k][p]=TREE[k][p]||{};TREE[k][p][c]=TREE[k][p][c]||{};
  TREE[k][p][c][o]=TREE[k][p][c][o]||{};TREE[k][p][c][o][f]=(TREE[k][p][c][o][f]||0)+1;});
const OPEN=new Set(['動物界 Animalia']);
function toggleNode(n){OPEN.has(n)?OPEN.delete(n):OPEN.add(n);render()}
function treeHTML(){
  function walk(obj,depth){
    let h='';
    Object.keys(obj).sort().forEach(k=>{
      const leaf=typeof obj[k]==='number';
      const cnt=leaf?obj[k]:REC.filter(r=>SP[r.s].tax.indexOf(k)>=0).length;
      const op=OPEN.has(k);
      h+='<div class="tnode"><div class="row '+(F.fam===k?'sel':'')+'" onclick="'+(leaf?'pickFam(\''+k+'\')':'toggleNode(\''+k.replace(/'/g,"\\'")+'\')')+'">'+
         '<span class="tw">'+(leaf?'·':(op?'▾':'▸'))+'</span><span>'+k+'</span><span class="tn">'+cnt+'</span></div>';
      if(!leaf)h+='<div class="tkids '+(op?'open':'')+'">'+walk(obj[k],depth+1)+'</div>';
      h+='</div>';
    });return h;}
  return '<div class="tree">'+walk(TREE,0)+'</div>';
}

/* 地圖：以經緯度線性投影，含臺灣本島與離島輪廓 */
const TW=[[121.54,25.30],[121.75,25.15],[122.00,25.01],[121.90,24.85],[121.86,24.60],[121.65,24.20],[121.62,23.80],[121.48,23.40],[121.38,23.05],[121.20,22.80],[120.95,22.30],[120.85,21.90],[120.72,22.10],[120.55,22.30],[120.35,22.55],[120.20,22.90],[120.10,23.25],[120.13,23.60],[120.25,23.95],[120.45,24.25],[120.72,24.60],[120.95,24.85],[121.20,25.05],[121.40,25.20]];
const ISL=[[119.57,23.57,9,'澎湖'],[121.49,22.66,5,'綠島'],[121.55,22.03,5,'蘭嶼'],[120.37,22.34,4,'小琉球'],[121.93,24.84,3,'龜山島']];
const MW=430,MH=635,LNG0=119.2,LNG1=122.3,LAT0=21.5,LAT1=25.7;
function px(lng){return (lng-LNG0)/(LNG1-LNG0)*MW}
function py(lat){return (LAT1-lat)/(LAT1-LAT0)*MH}
function mapView(a){
  const pts={};let noc=0;
  a.forEach(r=>{if(r.lat==null||r.lng<LNG0||r.lng>LNG1||r.lat<LAT0){noc++;return;}
    const k=r.loc;pts[k]=pts[k]||{lat:r.lat,lng:r.lng,n:0,rs:[]};pts[k].n++;pts[k].rs.push(r);});
  const keys=Object.keys(pts);
  let svg='<svg viewBox="0 0 '+MW+' '+MH+'" role="img" aria-label="採集地點分布圖">';
  svg+='<polygon points="'+TW.map(p=>px(p[0]).toFixed(1)+','+py(p[1]).toFixed(1)).join(' ')+'" fill="#e8f0e2" stroke="#8fae94" stroke-width="1.4"/>';
  ISL.forEach(i=>{svg+='<circle cx="'+px(i[0]).toFixed(1)+'" cy="'+py(i[1]).toFixed(1)+'" r="'+i[2]+'" fill="#e8f0e2" stroke="#8fae94" stroke-width="1.2"/>';
    svg+='<text x="'+(px(i[0])+i[2]+4).toFixed(1)+'" y="'+(py(i[1])+4).toFixed(1)+'" font-size="10" fill="#5d707e">'+i[3]+'</text>';});
  keys.forEach(k=>{const p=pts[k];const R=7+Math.min(p.n,8)*2;
    svg+='<g class="mpt" onclick="mapPick(\''+k.replace(/'/g,"\\'")+'\')">'+
      '<circle cx="'+px(p.lng).toFixed(1)+'" cy="'+py(p.lat).toFixed(1)+'" r="'+R+'" fill="rgba(224,102,60,.75)" stroke="#fff" stroke-width="2"/>'+
      '<text x="'+px(p.lng).toFixed(1)+'" y="'+(py(p.lat)+4).toFixed(1)+'" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">'+p.n+'</text></g>';});
  svg+='</svg>';
  let side='<div class="mapside"><h4>採集／拍攝地點　'+keys.length+' 處</h4>';
  keys.sort((x,y)=>pts[y].n-pts[x].n).forEach(k=>{
    side+='<div class="li" onclick="mapPick(\''+k.replace(/'/g,"\\'")+'\')"><span class="dot"></span><span>'+k+'</span><span class="n">'+pts[k].n+'</span></div>';});
  side+='<div class="nocoord"><b>'+noc+' 筆</b>無座標或位於圖幅外（含東沙、南沙）。<br>現況：這些資料在地圖上會直接消失，使用者誤以為不存在；改版建議另立「未標定位置」群組，並在後台品質儀表板列管。</div>';
  side+='</div>';
  return '<div class="mapwrap"><div class="mapbox">'+svg+'</div>'+side+'</div>';
}

/* ══════════════════════ 以圖辨識 ══════════════════════
   說明：靜態檔無法載入 CV 模型。這裡實作的是真的在瀏覽器裡跑的
   「色彩特徵萃取 + 特徵比對」：把圖畫進 canvas、取主要色彩分佈，
   再與物種色彩／外型／棲地特徵比對排序。流程與 UX 與正式版一致，
   差別只在辨識引擎——正式版應接 CV 模型。                        */
const CNAME=[['黑',0,0,0],['白',0,0,100],['灰',0,0,55],['紅',0,80,60],['橘',28,80,70],['黃',52,75,75],
             ['綠',120,60,50],['藍',210,65,55],['紫',280,50,55],['褐',25,55,38],['粉',335,45,80]];
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0;if(d){if(mx===r)h=60*(((g-b)/d)%6);else if(mx===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4);}
  if(h<0)h+=360;return [h,mx?d/mx*100:0,mx*100];}
function colorName(r,g,b){const [h,s,v]=rgb2hsv(r,g,b);
  if(v<18)return '黑'; if(s<12)return v>82?'白':'灰';
  if(s<28&&v<62)return '褐';
  let best='灰',bd=1e9;
  CNAME.forEach(([n,ch,cs,cv])=>{if(n==='黑'||n==='白'||n==='灰')return;
    let dh=Math.abs(h-ch);if(dh>180)dh=360-dh;
    const d=dh*1.0+Math.abs(s-cs)*0.25+Math.abs(v-cv)*0.25;
    if(d<bd){bd=d;best=n}});
  return best;}
let IDENT={img:null,colors:null,shape:null,hab:null,name:''};
function count(d,bgc){
  const t={};
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<40)continue;
    if(bgc&&Math.hypot(d[i]-bgc[0],d[i+1]-bgc[1],d[i+2]-bgc[2])<58)continue;
    const n=colorName(d[i],d[i+1],d[i+2]);t[n]=(t[n]||0)+1;}
  return t;}
function analyzeImage(src,name){
  const im=new Image();
  im.onload=()=>{
    const c=document.createElement('canvas');c.width=64;c.height=64;
    const x=c.getContext('2d');x.drawImage(im,0,0,64,64);
    const d=x.getImageData(0,0,64,64).data;
    const at=(px,py)=>{const k=(py*64+px)*4;return [d[k],d[k+1],d[k+2]]};
    const cor=[at(1,1),at(62,1),at(1,62),at(62,62)];
    const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
    const uniform=cor.every(c=>dist(c,cor[0])<42);
    const bgc=[0,1,2].map(j=>cor.reduce((t,c)=>t+c[j],0)/4);
    let tally=count(d,uniform?bgc:null);
    if(uniform&&Object.values(tally).reduce((a,b)=>a+b,0)<64*64*0.05)tally=count(d,null);
    const tot=Object.values(tally).reduce((a,b)=>a+b,0)||1;
    const cols=Object.entries(tally).map(([n,v])=>({n:n,p:v/tot}))
      .sort((a,b)=>b.p-a.p).filter(c=>c.p>0.04).slice(0,4);
    IDENT.img=src;IDENT.colors=cols;IDENT.bgcut=uniform;IDENT.name=name||'上傳的照片';
    PAGE='ident';render();window.scrollTo(0,0);
  };
  im.onerror=()=>{alert('圖片讀取失敗，請換一張試試');};
  im.src=src;
}
function identScore(){
  if(!IDENT.colors)return [];
  return SP.map((s,i)=>{
    let sc=0;const why=[];
    IDENT.colors.forEach(c=>{if(s.color.indexOf(c.n)>=0){sc+=c.p*1.0;why.push('色彩「'+c.n+'」')}});
    if(IDENT.shape){if(s.shape===IDENT.shape){sc+=0.38;why.push('外型「'+IDENT.shape+'」')}else sc-=0.10}
    if(IDENT.hab){if(s.hab===IDENT.hab){sc+=0.26;why.push('棲地「'+IDENT.hab+'」')}else sc-=0.06}
    return {i:i,sc:sc,why:why};
  }).filter(r=>r.sc>0.02).sort((a,b)=>b.sc-a.sc).slice(0,8);
}

      '<div class="fchips">'+IDENT.colors.map(c=>{const cc=COLORS.find(x=>x[0]===c.n);
        return '<span class="chip"><span style="width:13px;height:13px;border-radius:50%;background:'+(cc?cc[1]:'#999')+';border:1px solid rgba(0,0,0,.15)"></span>'+c.n+' '+Math.round(c.p*100)+'%</span>'}).join('')+'</div>'+
      '<div class="ann">正式版可再加：EXIF 的 GPS 座標（自動限縮到該海域可能出現的物種）、拍攝日期（季節性物種）、以及使用者所在位置。現況兩站的 GPS 欄位多為空白，這也是後台上架流程要補的一環。</div>'+
      '<h4 style="margin:14px 0 7px;font-size:13.5px;color:var(--navy)">補充特徵可大幅提高準確度</h4>'+
      '<div style="font-size:12px;color:var(--mute);margin-bottom:6px">外型</div><div class="fchips">'+
      SHAPES.map(s=>'<button class="chip '+(IDENT.shape===s[0]?'on':'')+'" onclick="identPick(\'shape\',\''+s[0]+'\')">'+
      '<svg viewBox="0 0 100 100" fill="currentColor" stroke="currentColor">'+SIL[s[1]]+'</svg>'+s[0]+'</button>').join('')+'</div>'+
      '<div style="font-size:12px;color:var(--mute);margin:10px 0 6px">在哪裡看到的</div><div class="fchips">'+
      HABS.map(x=>'<button class="chip '+(IDENT.hab===x?'on':'')+'" onclick="identPick(\'hab\',\''+x+'\')">'+x+'</button>').join('')+'</div>'+
      '<button class="clearall" onclick="identReset()">換一張照片</button>'+
      '</div><div>';
    if(!rank.length){
      h+='<div class="empty" style="text-align:left"><b>色彩特徵沒有比對到明確候選</b>試著在左邊補充外型或棲地，或換一張主體更清楚、背景較單純的照片。</div>';
    } else {
      const mx=rank[0].sc||1;
      h+='<h3 style="font-size:15px;color:var(--navy);margin:0 0 4px">可能的物種　<span style="font-size:12px;color:var(--mute);font-weight:400">依特徵相符度排序</span></h3>'+
        '<div style="font-size:12.5px;color:var(--mute);margin-bottom:11px">請自行確認，辨識結果僅供參考</div>';
      h+='<div class="idlist">'+rank.map((r,n)=>{const x=SP[r.i];const pct=Math.round(r.sc/mx*100);
        return '<div class="idc" onclick="openSpecies('+r.i+')">'+
        '<span class="ic" style="'+bgOf(x.g)+'">'+ill(x.g,null,x.ic)+'</span>'+
        '<span style="flex:1;min-width:0"><span class="zh">'+(n===0?'▲ ':'')+x.zh+'</span>'+
        '<span class="sci" style="margin-left:6px">'+x.sci+'</span>'+
        '<div class="hit">'+(r.why.length?'比對到 '+[...new Set(r.why)].join('、'):'色彩接近')+'</div>'+
        '<div class="bar"><i style="width:'+pct+'%"></i></div></span>'+
        '<span class="pc">'+pct+'</span></div>';}).join('')+'</div>';
      h+='<div style="margin-top:14px;display:flex;gap:9px;flex-wrap:wrap">'+
        '<button class="btn-x" onclick="alert(\'Demo 示意：確認為此物種後，可將這張照片與地點回報給館方，成為公民科學觀察紀錄，經審核後納入資料庫。\')">✓ 確認並回報為觀察紀錄</button>'+
        '<button class="btn-x" onclick="alert(\'Demo 示意：都不是的話，可送出協助鑑定請求，由館方研究人員回覆。\')">都不是，請館方協助鑑定</button></div>';
    }
    h+='</div></div>';
  }
  h+='</div>'+
   '<div class="dsec"><h3>正式版的辨識引擎怎麼做</h3>'+
   '<div class="kv">'+
   [['最省力','串接 iNaturalist 或同類的既有影像辨識 API，直接取得候選物種，再對回館藏資料。優點是立刻可用、模型持續更新；缺點是無法保證涵蓋館藏的冷門類群。'],
    ['自建模型','以館藏的四萬筆影像微調（fine-tune）影像分類模型。館方的優勢正在於這批已標註物種的高品質影像，是外面沒有的訓練資料。'],
    ['混合式','先用通用模型判到「科」的層級，再用館藏影像訓練的小模型細分到種，並以 GPS 與季節限縮候選。'],
    ['同時做的事','辨識與檢索共用同一套物種主檔；使用者的回報成為新的標註資料，形成資料越用越好的循環。']]
   .map(r=>'<div class="r"><span class="k" style="min-width:74px">'+r[0]+'</span><span class="v">'+r[1]+'</span></div>').join('')+
   '</div>'+
   '<div class="ann">這一項的前提同樣是資料整備：影像要有正確的物種標註、要有可用的授權、要有一致的欄位。館藏四萬筆影像目前「屬名」「種名」欄位多為空白，模型訓練會直接卡在這裡——這也再次說明第一期的資料清洗為什麼不能跳過。</div>'+
   '</div></div></div>';
  return h;
}

/* ══════════════════════ render ══════════════════════ */
function render(){
  ['auto','lit','sem'].forEach(m=>{const b=document.getElementById('qm-'+m);if(b)b.classList.toggle('on',QMODE===m)});
  const app=document.getElementById('app');
  if(PAGE==='home')app.innerHTML=homeHTML();
  else if(PAGE==='sp')app.innerHTML=speciesHTML(CUR);
  else if(PAGE==='ident')app.innerHTML=identHTML();
  else app.innerHTML=topicsHTML();
}
render();
</script>
</body>
</html>
