    <script>
        // ================= Tooltip 渲染輔助函數 =================
        function renderTH(title, subtitle, desc) {
            return `

                    <span class="text-gray-300">${title}</span>
                    <div class="group outline-none cursor-pointer flex items-center" tabindex="0" onclick="event.stopPropagation()">

                        </svg>

                            <div class="text-gray-300">${desc}</div>

        let lang = 'zh';

        function changeLanguage(selectedLang) {
            lang = selectedLang;
            const dict = i18n[lang];

            // 收合所有開啟的子表，避免語系切換文字錯亂
            if ($.fn.DataTable.isDataTable('#records-table')) {
                const table = $('#records-table').DataTable();
                table.rows().every(function () {
                    if (this.child.isShown()) {
                        this.child.hide();
                        $(this.node()).removeClass('shown');
                    }
                });
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerHTML = dict[key];
            });

            // 更新展開按鈕
            document.querySelectorAll('.btn-expand-text').forEach(el => {
                el.innerText = dict.btnExpand;
            });
            document.querySelectorAll('.btn-details svg').forEach(el => {
                el.style.transform = 'rotate(0deg)';
            });

            // 更新操作按鈕的語系
            document.querySelectorAll('.btn-detail-text').forEach(el => {
                el.innerText = dict.btnDetail;
            });
            document.querySelectorAll('.btn-inv-text').forEach(el => {
                el.innerText = dict.btnInventory;
            });
            document.querySelectorAll('.btn-alt-text').forEach(el => {
                el.innerText = dict.btnAlerts;
            });

            if ($.fn.DataTable.isDataTable('#records-table')) {
                const table = $('#records-table').DataTable();
                table.context[0].oLanguage.sSearch = dict.dtSearch;
                table.context[0].oLanguage.oPaginate.sNext = dict.dtNext;
                table.context[0].oLanguage.oPaginate.sPrevious = dict.dtPrev;
                table.context[0].oLanguage.sInfo = dict.dtInfo;
                table.context[0].oLanguage.sInfoEmpty = dict.dtEmpty;
                table.context[0].oLanguage.sZeroRecords = dict.dtZero;

        // 格式化子表 HTML (加上 MT 單位)
        function formatDetails(d) {
            const row = (label, val, note) => `
                <tr class="border-b border-gray-700">
                    <td class="py-2 px-2 w-1/2 tracking-wide">${label}</td>
                    <td class="py-2 px-2 w-1/2 text-left tracking-wide ${note ? 'text-gray-500' : ''}">${val}</td>
                </tr>`;
            const pct = v => d.fuel > 0 ? ` <span class="text-gray-500 text-xs">(${(v / d.fuel * 100).toFixed(1)}%)</span>` : '';
            return `
                <div class="">
                    <div class="w-full max-w-[460px]">
                        <div class="text-xs text-emerald-400 mb-2">★ 以下為 CIIFleetFuelReport CSV（2026-08-25 版，22 欄）實際累計值（${d.events.toLocaleString()} 筆事件）</div>
                        <table class="w-full text-base text-gray-300">
                            ${row('HSFO 高硫重油', d.hfo.toLocaleString() + ' MT' + pct(d.hfo))}
                            ${row('VLSFO 超低硫重油', d.lsfo.toLocaleString() + ' MT' + pct(d.lsfo))}
                            ${row('ULSFO 極低硫重油', (d.ulsfo || 0).toLocaleString() + ' MT' + pct(d.ulsfo || 0))}
                            ${row('Blend 混合油', (d.blend || 0).toLocaleString() + ' MT' + pct(d.blend || 0))}
                            ${row('Unclassified 未分類', (d.unc || 0).toLocaleString() + ' MT' + pct(d.unc || 0))}
                            ${row('MGO/MDO 輕油', d.mgo.toLocaleString() + ' MT' + pct(d.mgo))}
                            ${row('合計', '<b class="text-white">' + d.fuel.toLocaleString() + ' MT</b>', false)}
                            ${row('全期航距（全部報表）', (d.dist26 ? Math.round(d.dist26).toLocaleString() + ' nm（' + d.voy26 + ' 航次）' : '—'), false)}
                            ${row('其中海上航行航距', (d.seaDist ? Math.round(d.seaDist).toLocaleString() + ' nm' : '—'), false)}
                            ${row('海上航行天數 (NoonSea 午報筆數)', (d.seaDays ? d.seaDays.toLocaleString() + ' 天' : '—'), false)}
                            ${row('海上日耗油中位數 (午報)', (d.seaMed ? d.seaMed.toFixed(1) + ' MT/day' : '—'), false)}
                            ${row('貨載已知涵蓋率', (d.ccov !== undefined ? d.ccov.toFixed(1) + ' %' : '—'), true)}
                            ${row('全期加油', (d.bunk26 ? d.bunk26 + ' 次' : '—'), false)}
                            ${row('Cylinder Oil 汽缸油', '待中運提供', true)}
                            ${row('System Oil 系統油', '待中運提供', true)}
                        </table>
                    </div>
                </div>
            `;
        }

        $(document).ready(function () {
            const tbody = document.getElementById('table-body');
            let html = '';

            FLEET_ROWS.forEach((row, index) => {
                const clsLabel = { Capesize: '海岬型', Handysize: '輕便型', SmallBulk: '小型散裝' }[row.cls] || row.cls;
                const clsColor = { Capesize: 'text-blue-300', Handysize: 'text-amber-300', SmallBulk: 'text-emerald-300' }[row.cls] || 'text-gray-300';
                const na = v => (v === null || v === undefined) ? '<span class="text-gray-600">—</span>' : v;
                html += `
                    <tr>
                        <td class="text-gray-400">${row.id}</td>
                        <td>${row.imo}</td>
                        <td>
                            <a href="CSE-BunkerTracking-RecordsSingle-demo.html?vesselId=${row.imo}&from=records" class="text-blue-400 hover:text-blue-300 underline underline-offset-4 decoration-blue-800 hover:decoration-blue-400 transition">
                                ${row.name}
                            </a>
                        </td>
                        <td class="${clsColor}">${clsLabel}</td>
                        <td class="text-gray-300">${row.dwt.toLocaleString()}</td>
                        <td class="text-gray-300">${row.year}</td>
                        <td class="text-gray-300">${row.voy26 || '—'}</td>
                        <td class="text-gray-300">${row.dist26 ? Math.round(row.dist26).toLocaleString() : '—'}</td>
                        <td class="text-gray-100 font-semibold">${na(row.nmmt26 && row.nmmt26.toFixed(2))}</td>
                        <td class="text-gray-300">${na(row.aer26 && row.aer26.toFixed(2))}</td>
                        <td class="text-gray-300">${row.eeoi ? row.eeoi.toFixed(2) + `<span class="text-gray-500 text-xs ml-1">(${row.ccov.toFixed(1)}%)</span>` : '<span class="text-gray-600">—</span>'}</td>
                        <td class="text-gray-300">${row.bunk26 || '—'}</td>
                        <td>
                            <div class="flex items-center space-x-3">
                                <span class="w-20">${row.fuel.toLocaleString()}</span>
                                <button data-index="${index}" class="btn-details flex items-center space-x-1 border border-gray-500 text-gray-300 px-2 py-1 rounded hover:bg-gray-700 hover:text-white transition">
                                    <svg class="w-3 h-3 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    <span class="btn-expand-text text-[14px]">${i18n.zh.btnExpand}</span>
                                </button>
                            </div>
                        </td>
                        <td></td>
                    </tr>`;
            });
            tbody.innerHTML = html;

            // 初始化 DataTables
            const table = $('#records-table').DataTable({
                pageLength: 20,
                lengthChange: false, 
                ordering: true,
                info: true,
                autoWidth: false,
                language: {
                    info: i18n.zh.dtInfo,
                    infoEmpty: i18n.zh.dtEmpty,
                    zeroRecords: i18n.zh.dtZero,
                    paginate: {
                        previous: i18n.zh.dtPrev,
                        next: i18n.zh.dtNext
                    }
                }
            });

            // 綁定「展開」按鈕事件
            $('#records-table tbody').on('click', '.btn-details', function () {
                const tr = $(this).closest('tr');
                const row = table.row(tr);
                const dataIndex = $(this).data('index');
                const rowData = FLEET_ROWS[dataIndex];

                if (row.child.isShown()) {
                    // 已開啟則關閉
                    row.child.hide();
                    tr.removeClass('shown');
                    $(this).find('.btn-expand-text').text(i18n[lang].btnExpand);
                    $(this).find('svg').css('transform', 'rotate(0deg)');
                } else {
                    // 關閉則展開
                    row.child(formatDetails(rowData)).show();
                    tr.addClass('shown');
                    $(this).find('.btn-expand-text').text(i18n[lang].btnCollapse);
                    $(this).find('svg').css('transform', 'rotate(180deg)');
                }
            });

            // 綁定自訂的搜尋框
            $('#custom-search-input').on('keyup', function () {
                table.search(this.value).draw();
            });
            
            // 執行第一次語系設定
            changeLanguage('zh');
        });

        // 取消按鈕功能
        function clearSearch() {
            const input = document.getElementById('custom-search-input');
            input.value = '';
            $('#records-table').DataTable().search('').draw();
        }
    </script>
