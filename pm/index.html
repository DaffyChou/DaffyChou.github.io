 new Chart(document.getElementById('stChart'),{type:'bar',data:{labels:Object.keys(sts),datasets:[{data:Object.values(sts),backgroundColor:Object.keys(sts).map(s=>SC[s]||'#888')}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8ea3b5'}},y:{ticks:{color:'#8ea3b5'}}}}});
 const od=overdue.slice().sort((a,b)=>a.dd<b.dd?-1:1);
 document.getElementById('odTable').innerHTML='<tr><th>任務</th><th>狀態</th><th>專案</th><th>到期</th><th>逾期天</th><th>開發</th></tr>'+od.map(t=>{const days=Math.round((new Date(today)-new Date(t.dd))/864e5);return `<tr><td>${t.t}</td><td><span class="badge" style="background:${SC[t.s]||'#888'}">${t.s}</span></td><td>${t.pj}</td><td>${t.dd}</td><td class="od">${days}</td><td>${t.dev}</td></tr>`}).join('');
 const dev={};T.forEach(t=>{dev[t.dev]=dev[t.dev]||{n:0,od:0};dev[t.dev].n++;if(t.dd&&t.dd<today)dev[t.dev].od++;});
 const devs=Object.entries(dev).sort((a,b)=>b[1].n-a[1].n);
 document.getElementById('devTable').innerHTML='<tr><th>開發人員</th><th>任務數</th><th>逾期</th></tr>'+devs.map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td class="${v.od?'od':''}">${v.od}</td></tr>`).join('');
 document.getElementById('pjTable').innerHTML='<tr><th>專案</th><th>進度</th><th>分類</th><th>負責</th></tr>'+P.map(p=>`<tr><td>${p.name}</td><td><span class="tag">${p.status}</span></td><td>${p.cat||'—'}</td><td>${p.owner||'—'}</td></tr>`).join('');
 document.getElementById('progTable').innerHTML='<tr><th>專案</th><th>完成/總數</th><th>完成度</th><th></th></tr>'+D.progress.map(p=>`<tr><td>${p.name}</td><td>${p.done}/${p.tot}</td><td>${p.pct}%</td><td><div class="bar"><i style="width:${p.pct}%"></i></div></td></tr>`).join('');
 const ts=T.slice().sort((a,b)=>(a.dd||'9')<(b.dd||'9')?-1:1);
 document.getElementById('taskTable').innerHTML='<tr><th>任務</th><th>狀態</th><th>專案</th><th>開發</th><th>開始</th><th>到期</th><th>工時</th></tr>'+ts.map(t=>`<tr><td>${t.t}</td><td><span class="badge" style="background:${SC[t.s]||'#888'};color:${['測試','PM測試'].includes(t.s)?'#000':'#fff'}">${t.s}</span></td><td>${t.pj}</td><td>${t.dev}</td><td>${t.sd||'—'}</td><td class="${t.dd&&t.dd<today?'od':''}">${t.dd||'—'}</td><td>${t.h==null?'—':t.h}</td></tr>`).join('');
}
init();
</script></body></html>
